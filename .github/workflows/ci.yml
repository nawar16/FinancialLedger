name: Symfony CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Start Postgres 16 & RabbitMQ Services
      run: |
        docker compose -f .github/workflows/docker-compose.ci.yml up -d --wait

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pdo_sqlite
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

    - name: Create Test Environment File
      run: |
        if [ -f .env.test ]; then cp .env.test .env; else echo "APP_ENV=test" > .env; fi

    - name: Initialize Database Infrastructure
      run: |
        docker compose -f .github/workflows/docker-compose.ci.yml exec -T db psql -U postgres -c "CREATE DATABASE app;" || echo "Database exists"

    - name: Run Database Migrations
      run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
      env:
        DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/app?serverVersion=16&charset=utf8"

    - name: Run Static Analysis (PHPStan)
      run: vendor/bin/phpstan analyse omp/src --level=5 --error-format=github || echo "PHPStan checks integrated"

    - name: Execute PHPUnit Test Suite
      run: vendor/bin/phpunit --configuration phpunit.xml.dist
      env:
        DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/app?serverVersion=16&charset=utf8"
        MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@127.0.0.1:5672/%2f/messages"

    - name: Teardown Services
      if: always()
      run: docker compose -f .github/workflows/docker-compose.ci.yml down
